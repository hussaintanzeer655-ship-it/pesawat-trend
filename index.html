<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pesawat Trend Tracker</title>
  <meta name="description" content="A polished, accessible one-page static site highlighting the strongest trend opportunity around &#39pesawat&#39 (airplanes) with quick insights and visuals." />
  <style>
    :root{
      --bg: #0e111a;
      --card: #181e2b;
      --text: #e6eaf6;
      --muted: #a9b3c7;
      --accent: #4cc9f0;
      --accent-2: #7b61ff;
      --grid: rgba(255,255,255,.06);
      --shadow: 0 10px 25px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial;
      background: radial-gradient(1200px circle at 10% -10%, rgba(76,201,240,.15), transparent 40%),
                  radial-gradient(900px circle at 90% 0%, rgba(123,97,255,.15), transparent 40%),
                  var(--bg);
      color: var(--text);
      line-height:1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    header.site-header{
      position: sticky; top:0; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding: 1rem 1.25rem;
      background: rgba(12,14,20,.85);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .brand{display:flex; align-items:center; gap:.75rem}
    .brand svg{width:28px; height:28px}
    .brand h1{font-size:1.05rem; margin:0; letter-spacing:.3px}
    nav{display:flex; gap:.75rem; flex-wrap:wrap}
    nav a{color:var(--text); text-decoration:none; padding:.5rem .75rem; border-radius:6px}
    nav a:focus-visible, button:focus-visible{outline:2px solid #fff; outline-offset:2px}
    main{max-width:1100px; margin:0 auto; padding:2rem 1rem 4rem}
    section{margin:2rem 0}
    h2{font-size:1.6rem; margin:.25rem 0 0.5rem}
    .subtitle{color:var(--muted); font-size:.95rem; margin-bottom: .75rem}
    .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:1rem}
    .card{background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
          border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:1rem; box-shadow: var(--shadow);}
    .card h3{margin:0 0 .5rem 0; font-size:1.1rem}
    .lead{font-size:.95rem; color:var(--muted)}
    .stat{font-weight:700; font-size:1.15rem; margin-top:.25rem}
    .illustration{width:100%; height:180px; display:block}
    .cta{display:inline-flex; align-items:center; gap:.5rem; padding:.6rem 1rem;
         border-radius:999px; border:1px solid rgba(76,201,240,.8);
         background: linear-gradient(135deg, rgba(76,201,240,.25), rgba(123,97,255,.25));
         color:#e8fbff; text-decoration:none; cursor:pointer}
    .badge{display:inline-flex; align-items:center; gap:.35rem;
           padding:.25rem .6rem; border-radius:999px; background:#1e2730; color:#d3e8ff;
           font-size:.8rem; border:1px solid rgba(255,255,255,.08)}
    footer{text-align:center; color:var(--muted); padding-top:1rem}
    /* responsive tweaks for accessibility */
    @media (max-width: 700px){
      header.site-header{flex-direction:column; align-items:flex-start; gap:.5rem}
      nav{width:100%; justify-content: flex-start; margin-top:.25rem}
    }
  &lt;/style&gt;
&lt;/head&gt;

  &lt;script&gt;
    // Simple enhancement: keep focus-visible state and a tiny smooth scroll for anchor links
    (function(){
      function smoothScroll(e){
        if (e.target.tagName.toLowerCase() === &#39;a&#39; &amp;&amp; e.target.getAttribute(&#39;href&#39;).startsWith(&#39;#&#39;)) {
          var id = e.target.getAttribute(&#39;href&#39;).slice(1);
          var el = document.getElementById(id);
          if (el) {
            e.preventDefault();
            el.scrollIntoView({behavior:&#39;smooth&#39;, block:&#39;start&#39;});
            history.pushState(null, &#39;&#39;, &#39;#&#39;+id);
          }
        }
      }
      document.addEventListener(&quot;click&quot;, smoothScroll);
    })();
  &lt;/script&gt;
